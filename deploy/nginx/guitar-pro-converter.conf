server {
    listen 80;
    listen [::]:80;
    server_name guitar-pro-converter.eva-chat.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/guitar-pro-converter/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name guitar-pro-converter.eva-chat.ru;
    ssl_certificate /etc/letsencrypt/live/guitar-pro-converter.eva-chat.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guitar-pro-converter.eva-chat.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/guitar-pro-converter/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / { try_files $uri $uri/ =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
}
